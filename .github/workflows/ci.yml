name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit all dependencies
        run: pnpm audit --audit-level low

      - name: Verify
        run: pnpm verify

      - name: Build packages
        run: pnpm build

      - name: Package CLI
        run: pnpm package:cli

      - name: Package browser extension
        run: pnpm package:browser

      - name: Build signed-release inputs
        run: pnpm package:release

      - name: Test packaged CLI installation
        run: node scripts/test-cli-install.mjs

  browser-e2e:
    name: Chromium extension E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @privacy-guard/browser-extension exec playwright install --with-deps chromium

      - name: Run controlled extension E2E tests
        run: pnpm test:e2e:browser

  cli-e2e:
    name: CLI E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run packaged CLI E2E tests
        run: pnpm test:e2e:cli

      - name: Create installable CLI package
        run: |
          node -e "require('node:fs').mkdirSync('artifacts/release', { recursive: true })"
          npm pack apps/cli --pack-destination artifacts/release

      - name: Install and exercise every CLI feature category
        run: node scripts/test-cli-install.mjs
